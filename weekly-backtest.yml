name: weekly backtest

on:
  schedule:
    # 토요일 23:00 UTC = 일요일 08:00 KST
    - cron: "0 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 긴 기간 백테스트
        run: python backtest.py --download

      - name: 사이트 다시 생성
        run: python build_site.py

      - name: 결과 커밋
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "backtest: $(date -u +%Y-%m-%d)"
            git push
          fi
