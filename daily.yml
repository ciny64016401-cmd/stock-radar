name: daily radar

on:
  schedule:
    # 22:00 UTC = 다음날 07:00 KST. 미국장 마감 후입니다.
    # 월~금 실행 (UTC 기준). 크론은 UTC만 씁니다.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 손으로 돌릴 수도 있습니다

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스크리너 실행
        run: python radar.py

      - name: 사이트 생성
        run: python build_site.py

      - name: 결과 커밋
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d)"
            git push
          fi
